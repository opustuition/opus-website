<div class="testimonial">
    <div class="testimonial-photo">
        <img src="{{ '/assets/images/' | append: include.img | relative_url }}" alt="" loading="lazy" />
    </div>
    <div class="testimonial-text">
        &quot;{{ include.text }}&quot;
    </div>
    <div class="testimonial-source">
        &mdash;{{ include.source }}
    </div>
</div>

<div class="footer">
    <img src="{{ '/assets/images/logo.png' | relative_url }}" class="footer-logo" alt="OPUS Tuition logo" />
    <div class="footer-contact">
        <div class="footer-contact-card">
            <div class="footer-phone">
                <div class="footer-phone-icon"></div>
                <div class="footer-phone-text">{{ site.data.contact.phone_display }}</div>
            </div>
            <div class="footer-email">
                <div class="footer-email-icon"></div>
                <div class="footer-email-text">{{ site.data.contact.email }}</div>
            </div>
        </div>
        <div class="footer-contact-card footer-hours">
            <div class="footer-card-label">Operational Hours</div>
            <div class="footer-hours-text">8:00 AM - 7:00 PM daily</div>
        </div>
        <div class="footer-contact-card footer-waitlist-card">
            <div class="footer-card-label">Join Waitlist on WhatsApp </div>
            <div class="footer-hours-text">Send us a WhatsApp message and we’ll respond with the next steps.</div>
            <a class="cta" href="{{ site.data.contact.whatsapp_waitlist }}" target="_blank"
                rel="noopener noreferrer"> <span class="footer-social-icon footer-social-whatsapp"></span>
                Message on WhatsApp
            </a>
        </div>
        <div class="footer-contact-card footer-social-card">
            <div class="footer-card-label">Follow Us</div>
            <div class="footer-social">
                <a href="https://www.facebook.com/people/Opus-Tuition/61562856157777/" aria-label="Facebook"
                    target="_blank" rel="noopener noreferrer">
                    <span class="footer-social-icon footer-social-facebook"></span>
                </a>
                <a href="https://www.instagram.com/opus_tuition/" aria-label="Instagram" target="_blank"
                    rel="noopener noreferrer">
                    <span class="footer-social-icon footer-social-instagram"></span>
                </a>
                <a href="https://www.linkedin.com/company/opus-tuition/" aria-label="LinkedIn" target="_blank"
                    rel="noopener noreferrer">
                    <span class="footer-social-icon footer-social-linkedin"></span>
                </a>
                <a href="https://www.tiktok.com/@opus_tuition" aria-label="TikTok" target="_blank"
                    rel="noopener noreferrer">
                    <span class="footer-social-icon footer-social-tiktok"></span>
                </a>
                <a href="https://xhslink.com/m/oLF6EGpfHu" aria-label="Xiaohongshu" target="_blank"
                    rel="noopener noreferrer">
                    <span class="footer-social-icon footer-social-xiaohongshu"></span>
                </a>
            </div>
        </div>
    </div>
    {% include nav.html %}
    <div class="footer-copy">Opus Tuition &copy; {{ "now" | date: "%Y" }}</div>
</div>

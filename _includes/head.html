<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        OPUS Tuition | #1 Personalised Home Tuition Singapore
        {% if page.title %}
        - {{ page.title }}
        {% endif %}
    </title>
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicons/apple-touch-icon.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicons/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicons/favicon-16x16.png' | relative_url }}">
    <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" type="text/css" href="{{ '/assets/css/main.css' | relative_url }}">
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    <style>
        @font-face {
            font-family: "Dunkin";
            src: url("{{ '/assets/fonts/Dunkin.otf' | relative_url }}");
        }

        @font-face {
            font-family: "LoRes";
            src: url("{{ '/assets/fonts/LoRes-120T-Regular.ttf' | relative_url }}");
        }

        @font-face {
            font-family: "LoRes Narrow";
            src: url("{{ '/assets/fonts/LoRes-150T-NarrowRegular.ttf' | relative_url }}");
        }

        @font-face {
            font-family: "Lexend";
            src: url("{{ '/assets/fonts/Lexend/Lexend-VariableFont_wght.ttf' | relative_url }}");
        }
    </style>

    {% if page.custom_css %}
    {% for stylesheet in page.custom_css %}
    <link rel="stylesheet" href="{{ '/assets/css/pages/' | append: stylesheet | append: '.css' | relative_url }}" media="screen" type="text/css">
    {% endfor %}
    {% endif %}

</head>

# Add 3–5 approved tutor testimonials here. Each entry needs a quote, name and role.
# Example:
- quote: I actually joined OPUS because I wanted some extra income while studying. I did not expect to enjoy tutoring as much as I did. Over time, I became quite attached to my students because you see them struggle with something for weeks and then suddenly they get it. It’s actually really rewarding. The money definitely helped, especially as a student, but the experience itself has been valuable too
  name: Isabelle
  role: NUS

- quote: I used to be quite bad at explaining things. I knew the answers, but I did not always know how to explain how I got there. That’s why the training process before I could officially start tutoring was quite intense. I had to pause to reframe my thoughts simply before speaking. Tutoring forced me to consistently practise slowing down and thinking about things from someone else's perspective. Now when I am working with people at university or during internships, I find myself doing the same thing. I think about what the other person actually needs to understand rather than just saying what I know.
  name: Faith
  role: NUS
  image: beans/bean-orange-bg-blue.svg

- quote: Before I started I thought tutoring would be quite repetitive. I was expecting to teach the same topics every week and mark some work. But every student I have taught is so different that the lessons actually feel very different. Sometimes spending time with students were kind of fun. I also realised that I spend quite a bit of time figuring out why a student made a mistake than teaching the actual topic. That process has made me much more thoughtful about how I communicate.
  name: Ray
  role: NTU
  image: beans/bean-orange-bg-blue.svg

- quote: When I told my mother I was tutoring she laughed because she said I wouldn’t have the patience or skill to impart knowledge. That made me very worried when I first started. But the training helped me get a good sense of where to improve and how to improve. The trainers were also very understanding throughout the tutoring process. When I faced challenges tutoring my first student, they brainstormed with me new ways to approach my student’s struggles, but also reassured me that I am doing well and that helped me a lot in my confidence when tutoring.
  name: Claris
  role: NUS
  image: beans/bean-orange-bg-blue.svg
